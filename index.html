<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Modern Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- THREE JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<!-- NAVBAR -->
<header>
  <nav>
    <h2>MySite</h2>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<!-- HERO (3D BACKGROUND) -->
<section class="hero">
  <div id="three-container"></div>

  <div class="hero-content">
    <h1>Welcome</h1>
    <p>Modern 3D Website</p>
  </div>
</section>

<!-- SECTION 1 -->
<section class="section fade">
  <div class="text">
    <h2>Our Mission</h2>
    <p>We provide best services with modern design.</p>
  </div>
  <div class="image">
    <img src="https://picsum.photos/400">
  </div>
</section>

<!-- SECTION 2 -->
<section class="section reverse fade">
  <div class="text">
    <h2>Our Vision</h2>
    <p>Future with technology and creativity.</p>
  </div>
  <div class="image">
    <img src="https://picsum.photos/401">
  </div>
</section>

<!-- ABOUT -->
<section id="about" class="about fade">
  <h2>About Us</h2>
  <div class="stats">
    <div>1000+ Students</div>
    <div>200 Current</div>
    <div>50 Faculty</div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact fade">
  <h2>Contact</h2>
  <form>
    <input type="text" placeholder="Name">
    <input type="text" placeholder="Mobile">
    <input type="email" placeholder="Email">
    <textarea placeholder="Message"></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<!-- FOOTER -->
<footer>
  <p>📞 1234567890 | ✉ email@email.com</p>
  <p>© 2026 All Rights Reserved</p>
</footer>

<script src="script.js"></script>

</body>
</html>
